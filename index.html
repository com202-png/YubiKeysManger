<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YubiKey Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body data-theme="light">
  <div id="login-view">
    <div class="card card-pad login-card">
      <div class="brand" style="margin-bottom:18px"><div class="brand-mark"><i class="ti ti-key"></i></div>
        <div><div class="brand-name">YubiKey Manager</div></div></div>
      <form id="login-form">
        <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username" required /></div>
        <div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password" required /></div>
        <button class="btn btn-primary" id="login-submit" type="submit" style="width:100%;margin-top:6px">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner" style="width:28px;height:28px;border-width:3px"></div>
    <div class="text-muted text-sm">Loading YubiKey Manager…</div>
  </div>

  <div id="app-shell" style="display:none">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><i class="ti ti-key"></i></div>
        <div><div class="brand-name">YubiKey Manager</div><div class="brand-sub" id="company-name-label">Company</div></div>
      </div>
      <div class="nav-section">Overview</div>
      <div class="nav-item" data-view="dashboard"><span class="nav-icon"><i class="ti ti-layout-dashboard"></i></span>Dashboard</div>
      <div class="nav-section">Assets</div>
      <div class="nav-item" data-view="keys"><span class="nav-icon"><i class="ti ti-key"></i></span>YubiKeys</div>
      <div class="nav-item" data-view="pending-recovery"><span class="nav-icon"><i class="ti ti-user-exclamation"></i></span>Pending Recovery<span class="badge badge-lost" id="nav-pending-badge" style="display:none">0</span></div>
      <div class="nav-item" data-view="locker"><span class="nav-icon"><i class="ti ti-lock-access"></i></span>Locker</div>
      <div class="nav-section">Audits</div>
      <div class="nav-item" data-view="audits"><span class="nav-icon"><i class="ti ti-clipboard-check"></i></span>Audit Campaigns</div>
      <div class="nav-section">Insights</div>
      <div class="nav-item" data-view="reports"><span class="nav-icon"><i class="ti ti-file-export"></i></span>Reports</div>
      <div class="nav-item" data-view="activity"><span class="nav-icon"><i class="ti ti-history"></i></span>Activity Log</div>
      <div class="nav-section" id="admin-nav-section" style="display:none">Administration</div>
      <div class="nav-item" data-view="settings" id="admin-nav-settings" style="display:none"><span class="nav-icon"><i class="ti ti-settings"></i></span>Settings</div>
      <div class="nav-item" data-view="users" id="admin-nav-users" style="display:none"><span class="nav-icon"><i class="ti ti-shield-lock"></i></span>Users &amp; Roles</div>
    </aside>
    <div id="main">
      <div id="topbar">
        <button class="btn btn-icon btn-ghost" id="mobile-menu-btn" style="display:none"><i class="ti ti-menu-2"></i></button>
        <div class="title" id="page-title">Dashboard</div>
        <div class="spacer"></div>
        <input id="global-search" type="text" placeholder="Search serial, CCMS, email, manager…" />
        <button class="btn btn-icon btn-ghost" id="scan-btn" title="Scan a YubiKey"><i class="ti ti-fingerprint"></i></button>
        <button class="btn btn-icon btn-ghost" id="notif-btn" title="Notifications"><i class="ti ti-bell"></i></button>
        <button class="btn btn-icon btn-ghost" id="theme-toggle-btn" title="Toggle dark mode"><i class="ti ti-moon"></i></button>
        <button class="btn btn-icon btn-ghost" id="logout-btn" title="Sign out"><i class="ti ti-logout"></i></button>
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">--</div>
          <div><div style="font-size:12.5px;font-weight:600" id="user-name">—</div><div style="font-size:11px;color:var(--text-muted)" id="user-role">—</div></div>
        </div>
      </div>
      <div id="content"></div>
    </div>
  </div>

    <div id="toast-stack"></div>
  <div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-box"></div></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
