<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YubiKey Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
  <style>
:root{
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", Consolas, monospace;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

    --bg-page: #F6F6FB; --bg-surface: #FFFFFF; --bg-surface-2: #FAFAFD; --bg-sunken: #F0EFF8;
    --border: #E7E6F2; --border-strong: #D6D3E8;
    --text-primary: #16141F; --text-secondary: #5A5868; --text-muted: #928FA3;

    --accent: #7B2FF7; --accent-strong: #5E1FD1; --accent-bg: #F1E9FE; --accent-text: #5A1CC4;
    --brand-purple: #7B2FF7; --brand-blue: #2A6FF2; --brand-pink: #E0296B; --brand-navy: #0B0A12;
    --brand-gradient: linear-gradient(90deg, #7B2FF7 0%, #C42BA0 50%, #F2545B 100%);

    --success: #1FA971; --success-bg: #E3F8EE; --success-text: #0E7A4D;
    --warning: #C77F0A; --warning-bg: #FCF0DA; --warning-text: #7C4F04;
    --danger: #E23B5F; --danger-bg: #FCE9EF; --danger-text: #A3103A;
    --neutral: #5A5868; --neutral-bg: #F0EFF8; --neutral-text: #423F52;

    --shadow-card: 0 1px 2px rgba(22,20,31,.05), 0 1px 1px rgba(22,20,31,.04);
    --shadow-pop: 0 12px 32px rgba(22,20,31,.16), 0 2px 8px rgba(22,20,31,.08);
  }
  [data-theme="dark"]{
    --bg-page: #121018; --bg-surface: #1A1824; --bg-surface-2: #201D2C; --bg-sunken: #0E0C15;
    --border: #2C2839; --border-strong: #3C374C;
    --text-primary: #F1EFF7; --text-secondary: #ADA9C0; --text-muted: #726D89;
    --accent: #A472FF; --accent-strong: #BB93FF; --accent-bg: #2C1E52; --accent-text: #C6A8FF;
    --brand-purple: #A472FF; --brand-blue: #5B93FF; --brand-pink: #F45D8B; --brand-navy: #08070D;
    --brand-gradient: linear-gradient(90deg, #9147F0 0%, #D93FA8 50%, #F26A6A 100%);
    --success: #4FCC93; --success-bg: #163326; --success-text: #7FE0B4;
    --warning: #E0A83D; --warning-bg: #3A2C0F; --warning-text: #F2C271;
    --danger: #F06B8B; --danger-bg: #3A1B27; --danger-text: #F5A0B8;
    --neutral: #ADA9C0; --neutral-bg: #262234; --neutral-text: #D4D1E0;
    --shadow-card: 0 1px 2px rgba(0,0,0,.4); --shadow-pop: 0 16px 40px rgba(0,0,0,.55);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
  a{ color: var(--accent); text-decoration:none; } a:hover{ text-decoration:underline; }
  h1,h2,h3,h4{ margin:0 0 var(--sp-2); font-weight:700; letter-spacing:-.01em; }
  h1{ font-size:22px; } h2{ font-size:18px; } h3{ font-size:15px; } h4{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-secondary); }
  p{ margin:0 0 var(--sp-2); color:var(--text-secondary); }
  code, .mono{ font-family: var(--font-mono); }

  #app-shell{ display:flex; height:100vh; overflow:hidden; }
  #sidebar{ width: 240px; flex-shrink:0; background: var(--brand-navy); display:flex; flex-direction:column; padding: 0 0 var(--sp-4); position:relative; }
  #sidebar::before{ content:''; display:block; height:4px; width:100%; background: var(--brand-gradient); flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:10px; padding: var(--sp-4) var(--sp-4) var(--sp-4); border-bottom:1px solid rgba(255,255,255,.08); margin-bottom: var(--sp-3); }
  .brand-mark{ width:32px; height:32px; border-radius:9px; background: var(--brand-gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; box-shadow: 0 2px 10px rgba(123,47,247,.4); }
  .brand-name{ font-weight:700; font-size:14px; color:#fff; } .brand-sub{ font-size:11px; color:rgba(255,255,255,.5); }
  .nav-section{ padding: var(--sp-3) var(--sp-4) var(--sp-1); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.35); font-weight:700; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding: 9px var(--sp-4); margin: 1px var(--sp-2); border-radius: var(--radius-sm); color: rgba(255,255,255,.72); cursor:pointer; font-size:13.5px; font-weight:600; transition: background .12s, color .12s; }
  .nav-item:hover{ background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active{ background: var(--brand-gradient); color: #fff; box-shadow: 0 4px 14px rgba(123,47,247,.35); }
  .nav-item .badge{ margin-left:auto; } .nav-icon{ width:16px; text-align:center; opacity:.9; }

  #main{ flex:1; overflow-y:auto; display:flex; flex-direction:column; }
  #topbar{ display:flex; align-items:center; gap:var(--sp-3); padding: var(--sp-3) var(--sp-5); border-bottom:1px solid var(--border); background:var(--bg-surface); position:sticky; top:0; z-index:20; }
  #topbar .title{ font-size:16px; font-weight:700; } #topbar .spacer{ flex:1; }
  #global-search{ width:280px; } #content{ padding: var(--sp-5); flex:1; }
  .user-chip{ display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px; border-radius:20px; border:1px solid var(--border); cursor:pointer; }
  .user-avatar{ width:26px; height:26px; border-radius:50%; background: var(--brand-gradient); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }

  .btn{ display:inline-flex; align-items:center; gap:6px; border-radius: var(--radius-sm); padding: 9px 16px; font-size:13px; font-weight:700; cursor:pointer; border:1.5px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); transition: background .12s, border-color .12s, transform .08s; white-space:nowrap; }
  .btn:hover{ background: var(--bg-sunken); } .btn:active{ transform: translateY(1px); } .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background: var(--text-primary); border-color: var(--text-primary); color:#fff; } .btn-primary:hover{ background:#000; border-color:#000; }
  [data-theme="dark"] .btn-primary{ background: var(--brand-gradient); border-color: transparent; color:#fff; } [data-theme="dark"] .btn-primary:hover{ filter:brightness(1.1); }
  .btn-danger{ background: var(--danger); border-color: var(--danger); color:#fff; } .btn-danger:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border-color:transparent; } .btn-ghost:hover{ background: var(--bg-sunken); }
  .btn-sm{ padding:6px 12px; font-size:12px; } .btn-icon{ padding:7px; width:32px; height:32px; justify-content:center; }

  input, select, textarea{ width:100%; padding:9px 11px; border-radius: var(--radius-sm); border:1.5px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); font-family:inherit; font-size:13px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color: var(--accent); }
  label{ display:block; font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:4px; }
  .field{ margin-bottom: var(--sp-3); } .field-row{ display:flex; gap: var(--sp-3); } .field-row .field{ flex:1; }

  .card{ background: var(--bg-surface); border:1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .card-pad{ padding: var(--sp-4) var(--sp-5); }
  .kpi-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-5); }
  .kpi-card{ background: var(--bg-surface); border:1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-4); box-shadow: var(--shadow-card); }
  .kpi-label{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px; }
  .kpi-label .kpi-icon-chip{ width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; flex-shrink:0; }
  .kpi-value{ font-size:28px; font-weight:800; letter-spacing:-.02em; } .kpi-sub{ font-size:12px; color:var(--text-secondary); margin-top:4px; }
  .kpi-card.warn .kpi-value{ color: var(--warning); } .kpi-card.danger .kpi-value{ color: var(--danger); } .kpi-card.success .kpi-value{ color: var(--success); }
  .kpi-grid .kpi-card:nth-child(9n+1) .kpi-icon-chip{ background: var(--brand-purple); }
  .kpi-grid .kpi-card:nth-child(9n+2) .kpi-icon-chip{ background: var(--brand-blue); }
  .kpi-grid .kpi-card:nth-child(9n+3) .kpi-icon-chip{ background: var(--brand-pink); }
  .kpi-grid .kpi-card:nth-child(9n+4) .kpi-icon-chip{ background: var(--brand-blue); }
  .kpi-grid .kpi-card:nth-child(9n+5) .kpi-icon-chip{ background: var(--brand-purple); }
  .kpi-grid .kpi-card:nth-child(9n+6) .kpi-icon-chip{ background: var(--brand-pink); }
  .kpi-grid .kpi-card:nth-child(9n+7) .kpi-icon-chip{ background: var(--brand-blue); }
  .kpi-grid .kpi-card:nth-child(9n+8) .kpi-icon-chip{ background: var(--brand-pink); }
  .kpi-grid .kpi-card:nth-child(9n+9) .kpi-icon-chip{ background: var(--brand-purple); }

  .chart-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--sp-4); }
  .chart-card{ background: var(--bg-surface); border:1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-4); }
  .chart-canvas-wrap{ position:relative; height:240px; width:100%; }
  .chart-canvas-wrap canvas{ position:absolute; top:0; left:0; width:100% !important; height:100% !important; }
  .chart-load-error{ height:240px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:12px; text-align:center; padding:0 16px; }

  .table-wrap{ background: var(--bg-surface); border:1px solid var(--border); border-radius: var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-card); }
  table.data{ width:100%; border-collapse:collapse; font-size:13px; }
  table.data thead th{ text-align:left; padding:10px 14px; background: var(--bg-surface-2); color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); font-weight:700; position: sticky; top:0; cursor:pointer; user-select:none; }
  table.data thead th:hover{ color:var(--text-primary); }
  table.data tbody td{ padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text-primary); }
  table.data tbody tr:last-child td{ border-bottom:none; } table.data tbody tr:hover{ background: var(--bg-sunken); cursor:pointer; }
  .table-toolbar{ display:flex; gap:var(--sp-2); align-items:center; padding: var(--sp-3) var(--sp-4); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .table-toolbar .spacer{ flex:1; }
  .table-footer{ display:flex; align-items:center; justify-content:space-between; padding: var(--sp-3) var(--sp-4); font-size:12px; color:var(--text-muted); }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:.01em; }
  .badge-dot{ width:6px; height:6px; border-radius:50%; }
  .badge-active{ background:var(--success-bg); color:var(--success-text); } .badge-active .badge-dot{ background:var(--success); }
  .badge-resigned{ background:var(--neutral-bg); color:var(--neutral-text); } .badge-resigned .badge-dot{ background:var(--neutral); }
  .badge-returned{ background:var(--accent-bg); color:var(--accent-text); } .badge-returned .badge-dot{ background:var(--accent); }
  .badge-lost{ background:var(--danger-bg); color:var(--danger-text); } .badge-lost .badge-dot{ background:var(--danger); }
  .badge-pending{ background:var(--warning-bg); color:var(--warning-text); } .badge-pending .badge-dot{ background:var(--warning); }
  .badge-disabled{ background:var(--neutral-bg); color:var(--neutral-text); } .badge-disabled .badge-dot{ background:var(--text-muted); }

  #toast-stack{ position:fixed; bottom:20px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:8px; }
  .toast{ background: var(--bg-surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius: var(--radius-sm); padding:12px 16px; box-shadow: var(--shadow-pop); min-width:260px; font-size:13px; animation: toast-in .18s ease-out; }
  .toast.success{ border-left-color: var(--success); } .toast.error{ border-left-color: var(--danger); } .toast.warning{ border-left-color: var(--warning); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .modal-backdrop{ position:fixed; inset:0; background: rgba(11,10,18,.55); display:flex; align-items:center; justify-content:center; z-index:500; opacity:0; pointer-events:none; transition:opacity .15s; }
  .modal-backdrop.open{ opacity:1; pointer-events:all; }
  .modal{ background: var(--bg-surface); border-radius: var(--radius-lg); width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow: var(--shadow-pop); transform: translateY(8px); transition: transform .15s; }
  .modal-backdrop.open .modal{ transform: translateY(0); }
  .modal-header{ display:flex; align-items:center; padding: var(--sp-4) var(--sp-5); border-bottom:1px solid var(--border); }
  .modal-body{ padding: var(--sp-5); }
  .modal-footer{ display:flex; justify-content:flex-end; gap:var(--sp-2); padding: var(--sp-4) var(--sp-5); border-top:1px solid var(--border); }

  .flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; }
  .gap-1{gap:4px;} .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
  .mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;} .mb-3{margin-bottom:12px;}
  .text-muted{ color:var(--text-muted); } .text-sm{ font-size:12px; }
  .empty-state{ text-align:center; padding: var(--sp-10) var(--sp-4); color:var(--text-muted); }
  .empty-state i{ font-size:32px; opacity:.4; display:block; margin-bottom:10px; }
  .spinner{ width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading-overlay{ position:fixed; inset:0; background:var(--bg-page); display:flex; align-items:center; justify-content:center; z-index:2000; flex-direction:column; gap:10px; }
  .skeleton{ background: linear-gradient(90deg, var(--bg-sunken) 25%, var(--border) 37%, var(--bg-sunken) 63%); background-size:400% 100%; animation: sk 1.4s ease infinite; border-radius:6px; }
  @keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  .pill-select{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{ padding:6px 12px; border-radius:20px; border:1.5px solid var(--border-strong); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text-secondary); }
  .pill.active{ background: var(--brand-gradient); border-color:transparent; color:#fff; }
  .progress-bar{ height:8px; border-radius:6px; background:var(--bg-sunken); overflow:hidden; } .progress-bar > div{ height:100%; background: var(--brand-gradient); }
  .divider{ border-top:1px solid var(--border); margin: var(--sp-3) 0; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:6px; } ::-webkit-scrollbar-track{ background:transparent; }
  .scan-input{ font-family: var(--font-mono); font-size:16px; text-align:center; letter-spacing:1px; }
  .scan-hint{ display:flex; align-items:center; gap:8px; justify-content:center; color:var(--text-muted); font-size:12px; margin-top:10px; }
  .scan-pulse{ width:10px; height:10px; border-radius:50%; background: var(--brand-purple); animation: pulse 1.4s ease infinite; }
  @keyframes pulse{ 0%{ opacity:.4; transform:scale(.85);} 50%{ opacity:1; transform:scale(1.1);} 100%{ opacity:.4; transform:scale(.85);} }
  #mobile-menu-btn{ display:none; }
  #sidebar-shade{ display:none; }
  .table-wrap{ overflow-x:auto; }
  @media (max-width: 900px){
    #sidebar{ position:fixed; left:-250px; top:0; bottom:0; z-index:900; transition:left .2s; overflow-y:auto; }
    #sidebar.open{ left:0; box-shadow: var(--shadow-pop); }
    #sidebar.open ~ #sidebar-shade{ display:block; position:fixed; inset:0; background:rgba(11,10,18,.5); z-index:850; }
    #mobile-menu-btn{ display:inline-flex; }
    #global-search{ display:none; }
    #topbar{ padding:10px 12px; gap:6px; }
    #topbar .title{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .user-chip > div:last-child{ display:none; }
    .user-chip{ padding:3px; }
    #content{ padding:12px; }
    .kpi-grid{ grid-template-columns: repeat(2, 1fr); gap:8px; }
    .kpi-value{ font-size:22px; }
    .chart-grid{ grid-template-columns: 1fr; }
    .field-row{ flex-direction:column; gap:0; }
    .modal{ width:100vw; max-width:100vw; max-height:92vh; border-radius:16px 16px 0 0; align-self:flex-end; }
    .modal-backdrop{ align-items:flex-end; }
    .table-toolbar input, .table-toolbar select{ width:100% !important; }
    table.data{ min-width:640px; }
    table.data thead th, table.data tbody td{ padding:9px 10px; }
    #toast-stack{ left:12px; right:12px; bottom:12px; }
    .toast{ min-width:0; }
    .card-pad{ padding:14px; }
  }

/* sign-in screen */
#login-view{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--bg-page); z-index:2100; padding:16px; }
#login-view .login-card{ width:100%; max-width:380px; }
#login-view .login-error{ color:var(--danger); font-size:12.5px; min-height:18px; margin-top:8px; }
#login-view .login-switch{ text-align:center; font-size:12.5px; margin-top:14px; color:var(--text-secondary); }
#login-view .login-switch a{ color:var(--accent); cursor:pointer; font-weight:600; }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

        <button class="btn btn-primary" id="login-submit" type="submit" style="width:100%;margin-top:6px">Sign in</button>
        <div class="login-error" id="login-error"></div>

  <div id="app-shell" style="display:none">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><i class="ti ti-key"></i></div>
        <div><div class="brand-name">YubiKey Manager</div><div class="brand-sub" id="company-name-label">Company</div></div>
      </div>
      <div class="nav-section">Overview</div>
      <div class="nav-item" data-view="dashboard"><span class="nav-icon"><i class="ti ti-layout-dashboard"></i></span>Dashboard</div>
      <div class="nav-section">Assets</div>

      <div class="nav-section">Audits</div>
      <div class="nav-item" data-view="audits"><span class="nav-icon"><i class="ti ti-clipboard-check"></i></span>Audit Campaigns</div>
      <div class="nav-section">Insights</div>

/** Emails go out through the send-emails Edge Function. A failure there never
 *  blocks the action that triggered it. */
function sendEmails_(type, campaignId) {
  return sb.functions.invoke('send-emails', { body: { type: type, campaignId: campaignId } })
    .then(function (res) { if (res.error) throw res.error; return res.data; });
}

var AFTER_CALL = {
  api_launchAuditCampaign: function (res) {
    sendEmails_('audit_request', res.campaignId).catch(function () {
      toast('Audit created, but the request emails could not be sent. Check the email function setup.', 'warning');
    });
  },
  api_sendAuditReminders: function (res, args) {
    return sendEmails_('audit_reminder', args[0]);
  },
  api_submitAuditResult: function (res, args) {
    if (res && res.campaignComplete) sendEmails_('audit_complete', args[0]).catch(function () {});
  }
};

function call(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  var def = RPC[fnName];
  if (!def) return Promise.reject(new Error('Unknown call: ' + fnName));

  var params = {};
  def[1].forEach(function (name, i) { params[name] = args[i] === undefined ? null : args[i]; });

  return sb.rpc(def[0], params).then(function (res) {
    if (res.error) throw res.error;
    var after = AFTER_CALL[fnName];
    if (!after) return res.data;
    return Promise.resolve(after(res.data, args)).then(function () { return res.data; });
  }).catch(function (err) {
    var msg = (err && err.message) || 'Something went wrong. Please try again.';
    if (/JWT|expired/i.test(msg)) { showLogin_('Your session expired. Please sign in again.'); }
    else if (fnName !== 'api_getSession') toast(msg, 'error');
    throw err;
  });
}

// ---- OTP scan utility ----------------------------------------------------
// A physical YubiKey, when tapped while plugged in, types a modhex string
// via the keyboard (12-char public ID, then a longer part that changes
// every tap) and finishes with Enter. attachOtpScan reacts the moment the
// first 12 characters land — no need to wait for Enter — then either
// clears the field and resolves it to a key (resolve mode, the default),
// or leaves the 12-char prefix in the field for the person to save
// (capture mode, used when registering a new key's OTP).
var OTP_MODHEX = /^[cbdefghijklnrtuv]+$/i;
function looksLikeOtpPrefix(value) {
  return !!value && value.length >= 12 && OTP_MODHEX.test(value.slice(0, 12));
}
function attachOtpScan(inputEl, onDetected, opts) {
  opts = opts || {};
  var handled = false, quiet = null;
  // The key keeps typing (the rest of the OTP plus Enter) after the first
  // 12 characters, so the field is only reset once the typing has stopped.
  function settle() {
    clearTimeout(quiet);
    quiet = setTimeout(function () {
      inputEl.value = opts.capture ? inputEl.value.slice(0, 12).toLowerCase() : '';
      handled = false;
    }, 250);
  }
  inputEl.addEventListener('input', function () {
    if (handled) { settle(); return; }
    var val = inputEl.value.trim();
    if (looksLikeOtpPrefix(val)) {
      handled = true;
      onDetected(val.slice(0, 12).toLowerCase());
      settle();
    }
  });
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && handled) { e.preventDefault(); settle(); }
  });
}

    if (!select || select.dataset.populated) return;
    verticals.forEach(function (v) {
      var opt = document.createElement('option'); opt.value = v; opt.textContent = v; select.appendChild(opt);
    });
    select.dataset.populated = '1';
  });
}

function loadKeys_() {
  call('api_listKeys', KEY_STATE.filters).then(function (rows) {
    KEY_STATE.data = rows;
    renderKeyTable_(rows);
  });
}

function renderKeyTable_(rows) {
  var holder = document.getElementById('key-table-holder');
  document.getElementById('key-count-label').textContent = rows.length + ' key' + (rows.length === 1 ? '' : 's');
  if (!rows.length) { holder.innerHTML = emptyState('ti-key', 'No YubiKeys match your filters.'); return; }

  var cols = [
    ['Serial Number', 'serial'], ['Status', 'status'], ['CCMS', 'ccms'],
    ['Uber Email', 'uberEmail'], ['Manager CCMS', 'managerCcms'], ['Vertical', 'vertical']
  ];
  var html = '<table class="data"><thead><tr>' +
    cols.map(function (c) { return '<th data-field="' + c[1] + '">' + c[0] + '</th>'; }).join('') +
    '<th></th></tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr data-serial="' + escapeHtml(r.serial) + '">' +
        '<td class="mono">' + escapeHtml(r.serial) + '</td>' +
        '<td>' + statusBadge(r.status) + '</td>' +
        '<td class="mono">' + (r.ccms ? escapeHtml(r.ccms) : '<span class="text-muted">—</span>') + '</td>' +
        '<td class="text-muted">' + escapeHtml(r.uberEmail || '—') + '</td>' +
        '<td class="mono">' + escapeHtml(r.managerCcms || '—') + '</td>' +
        '<td>' + escapeHtml(r.vertical || '—') + '</td>' +
        '<td style="text-align:right"><i class="ti ti-chevron-right text-muted"></i></td>' +
        '</tr>';
    }).join('') +
    '</tbody></table>';
  holder.innerHTML = html;

  holder.querySelectorAll('tbody tr').forEach(function (tr) {
    tr.addEventListener('click', function () { openKeyDetail_(tr.dataset.serial); });
  });
  holder.querySelectorAll('thead th[data-field]').forEach(function (th) {
    th.addEventListener('click', function () {
      var field = th.dataset.field;
      KEY_STATE.sortDir = (KEY_STATE.sortField === field) ? -KEY_STATE.sortDir : 1;
      KEY_STATE.sortField = field;
      var sorted = rows.slice().sort(function (a, b) {
        return String(a[field] || '').localeCompare(String(b[field] || '')) * KEY_STATE.sortDir;
      });
      renderKeyTable_(sorted);
    });
  });
}

// ---- Detail / full history --------------------------------------------

function openKeyDetail_(serial) {
  openModal('<div class="modal-header"><h3>Loading…</h3></div><div class="modal-body"><span class="spinner"></span></div>');
  call('api_getKey', serial).then(function (k) {
    var isAdmin = APP.session.role === 'Admin';
    var canResign = isAdmin && k.status === 'Assigned';
    var canMarkReturned = isAdmin && k.status === 'Missing' && k.ccms;

    var historyHtml = k.history.length
      ? k.history.map(function (h) { return historyEntryHtml_(h); }).join('')
      : '<div class="text-muted text-sm">No history recorded for this key yet.</div>';

    openModal(
      '<div class="modal-header"><h3 class="mono">' + escapeHtml(k.serial) + '</h3><div class="spacer"></div>' + statusBadge(k.status) + '</div>' +
      '<div class="modal-body">' +
        '<div class="field-row"><div class="field"><label>CCMS</label><div class="mono">' + escapeHtml(k.ccms || '—') + '</div></div>' +
        '<div class="field"><label>Vertical</label><div>' + escapeHtml(k.vertical || '—') + '</div></div></div>' +
        '<div class="field-row"><div class="field"><label>Uber Email</label><div>' + escapeHtml(k.uberEmail || '—') + '</div></div>' +
        '<div class="field"><label>Manager CCMS</label><div class="mono">' + escapeHtml(k.managerCcms || '—') + '</div></div></div>' +
        '<div class="field"><label>OTP registered</label><div class="mono">' + (k.otp ? escapeHtml(k.otp) : '<span class="text-muted">Not registered — tap the key in Edit to add it</span>') + '</div></div>' +
        '<div class="divider"></div><h4>Full history — where it was, where it went, with whom</h4>' +
        '<div style="max-height:340px;overflow-y:auto">' + historyHtml + '</div>' +
      '</div>' +
      '<div class="modal-footer">' +
        (isAdmin ? '<button class="btn" id="key-edit-btn"><i class="ti ti-edit"></i> Edit</button>' : '') +
        (isAdmin && k.status !== 'Assigned' ? '<button class="btn" id="key-assign-btn"><i class="ti ti-key"></i> Assign</button>' : '') +
        (isAdmin ? '<button class="btn" id="key-status-btn"><i class="ti ti-refresh"></i> Change status</button>' : '') +
        (canResign ? '<button class="btn btn-danger" id="key-resign-btn"><i class="ti ti-user-off"></i> Holder resigned</button>' : '') +
        (canMarkReturned ? '<button class="btn btn-primary" id="key-returned-btn"><i class="ti ti-check"></i> Mark returned</button>' : '') +
        '<button class="btn" onclick="closeModal()">Close</button>' +
      '</div>'
    );

    if (isAdmin) {
      var editBtn = document.getElementById('key-edit-btn');
      if (editBtn) editBtn.addEventListener('click', function () { openKeyForm_(k); });
      var assignBtn = document.getElementById('key-assign-btn');
      if (assignBtn) assignBtn.addEventListener('click', function () { openAssignForm_(k.serial); });
      var statusBtn = document.getElementById('key-status-btn');
      if (statusBtn) statusBtn.addEventListener('click', function () { openEditKeyStatusForm_(k.serial); });
      var resignBtn = document.getElementById('key-resign-btn');
      if (resignBtn) resignBtn.addEventListener('click', function () { openResignForm_(k); });
      var returnedBtn = document.getElementById('key-returned-btn');
      if (returnedBtn) returnedBtn.addEventListener('click', function () {
        confirmDialog('Confirm return', 'Mark ' + k.serial + ' as returned and available for reassignment?', 'Confirm', function () {
          call('api_markKeyReturned', k.serial, '').then(function () { toast('Key marked as returned.', 'success'); openKeyDetail_(k.serial); loadKeys_(); });
        });
      });
    }
  });
}

function historyEntryHtml_(h) {
  var line;
  if (h.event === 'Assigned') {
    line = 'Assigned to <strong class="mono">' + escapeHtml(h.newCcms) + '</strong>' + (h.vertical ? ' (' + escapeHtml(h.vertical) + ')' : '');
  } else if (h.event === 'Status Change') {
    line = 'Status changed <strong>' + escapeHtml(h.previousStatus) + '</strong> → <strong>' + escapeHtml(h.newStatus) + '</strong>' +
      (h.newCcms ? ' — holder: <span class="mono">' + escapeHtml(h.newCcms) + '</span>' : '');
  } else if (h.event === 'Created') {
    line = 'Key added to the system' + (h.newStatus ? ' with status <strong>' + escapeHtml(h.newStatus) + '</strong>' : '');
  } else if (h.event === 'Details Updated') {
    line = 'Details updated' + (h.previousCcms !== h.newCcms ? (' — CCMS <span class="mono">' + escapeHtml(h.previousCcms || '—') + '</span> → <span class="mono">' + escapeHtml(h.newCcms || '—') + '</span>') : '');
  } else if (h.event === 'Deleted') {
    line = 'Key removed from the system';
  } else {
    line = escapeHtml(h.event);
  }
  return '<div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px">' +
    '<div style="display:flex;justify-content:space-between"><span>' + line + '</span>' +
    '<span class="text-muted" style="white-space:nowrap;margin-left:8px">' + escapeHtml(h.date) + '</span></div>' +
    '<div class="text-muted" style="margin-top:2px">by ' + escapeHtml(h.recordedBy) + (h.notes ? ' — ' + escapeHtml(h.notes) : '') + '</div>' +
    '</div>';
}

function openResignForm_(k) {
  openModal(
    '<div class="modal-header"><h3>Holder resigned — ' + escapeHtml(k.ccms) + '</h3></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>Has the YubiKey been returned?</label>' +
        '<div class="pill-select">' +
          '<div class="pill active" data-val="yes">Yes, returned</div>' +
          '<div class="pill" data-val="no">No, not yet</div>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>Notes</label><textarea id="f-resign-notes" rows="2" placeholder="Optional"></textarea></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="f-resign-save">Confirm</button></div>'
  );
  var selected = 'yes';
  document.querySelectorAll('.pill-select .pill').forEach(function (p) {

function openBulkImport_() {
  openModal(
    '<div class="modal-header"><h3>Bulk import keys</h3></div>' +
    '<div class="modal-body">' +
      '<p class="text-sm">Paste CSV with header row: <code>Serial Number,Status,CCMS,Uber Email,Manager CCMS,Vertical,OTP</code></p>' +
      '<textarea id="f-bulk-csv" rows="10" placeholder="Serial Number,Status,CCMS,Uber Email,Manager CCMS,Vertical,OTP"></textarea>' +
      '<div id="bulk-result" class="text-sm mt-2"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="f-bulk-save">Import</button></div>'
  );
  document.getElementById('f-bulk-save').addEventListener('click', function () {
    var csv = document.getElementById('f-bulk-csv').value.trim();
    if (!csv) return;
    var lines = csv.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    var header = lines[0].split(',').map(function (h) { return h.trim().toLowerCase(); });
    var rows = lines.slice(1).map(function (line) {
      var cells = line.split(',').map(function (c) { return c.trim(); });
      var obj = {};
      header.forEach(function (h, i) { obj[h] = cells[i] || ''; });
      return {
        serial: obj['serial number'], status: obj['status'], ccms: obj['ccms'],
        uberEmail: obj['uber email'], managerCcms: obj['manager ccms'], vertical: obj['vertical'],
        otp: obj['otp']
      };
    });
    call('api_bulkImportKeys', rows).then(function (res) {
      document.getElementById('bulk-result').innerHTML =
        '<span style="color:var(--success)">' + res.created + ' created</span>, ' +
        '<span style="color:var(--danger)">' + res.skipped + ' skipped</span>' +
        (res.errors.length ? '<div class="text-muted mt-2">' + res.errors.slice(0, 5).map(escapeHtml).join('<br>') + '</div>' : '');
      toast(res.created + ' key(s) imported.', 'success');
      loadKeys_();
    });
  });
}

    );

}

/* JsLocker — locker station (tap to check a key out or back in) and the
   list of keys that have not been returned. */

function renderLocker() {
  var content = document.getElementById('content');
  var isAdmin = APP.session.role === 'Admin';
  content.innerHTML =
    (isAdmin
      ? '<div class="table-wrap" style="padding:20px;margin-bottom:16px">' +
          '<input id="locker-input" class="scan-input" placeholder="Tap the key on the reader…" autocomplete="off" />' +
          '<div class="scan-hint"><span class="scan-pulse"></span>First tap checks the key out, second tap checks it back in</div>' +
          '<div style="text-align:center;margin-top:12px"><button class="btn" id="locker-nfc-btn"><i class="ti ti-nfc"></i> Scan with phone NFC</button>' +
            '<div class="text-sm text-muted" id="locker-nfc-note" style="margin-top:6px"></div></div>' +
          '<div id="locker-result" style="margin-top:14px;display:grid;gap:8px"></div>' +
        '</div>'
      : '') +
    '<div class="toolbar" style="display:flex;gap:8px;margin-bottom:12px">' +
      '<button class="btn btn-sm" id="lk-tab-out">Not returned</button>' +
      '<button class="btn btn-sm" id="lk-tab-today">Today</button>' +
      '<button class="btn btn-sm" id="lk-tab-all">All trips</button>' +
    '</div>' +
    '<div class="table-wrap"><div id="locker-list" style="padding:40px;text-align:center"><span class="spinner"></span></div></div>';

  var mode = 'out';
  function today_() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function hoursLabel_(h) {
    var m = Math.round(h * 60);
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  }
  var rows = [];
  function loadList() {
    var req = mode === 'out' ? call('api_listOutNow')
      : call('api_listMovements', mode === 'today' ? { date: today_() } : {});
    req.then(function (data) { rows = data; draw(); });
  }
  function draw() {
    var holder = document.getElementById('locker-list');
    if (!holder) return;
    (function () {
      if (!rows.length) {
        holder.innerHTML = emptyState('ti-circle-check', mode === 'out' ? 'Every key is back in the locker.' : 'No trips recorded.');
        return;
      }
      holder.innerHTML = '<table class="data"><thead><tr><th>Serial</th><th>CCMS</th><th>Vertical</th>' +
        '<th>Checked out</th><th>Returned</th><th>Time out</th><th></th></tr></thead><tbody>' +
        rows.map(function (r) {
          var state = r.isOpen
            ? '<span class="badge ' + (r.overdue ? 'badge-lost' : 'badge-pending') + '">Out</span>'
            : escapeHtml(r.returnedAt);
          return '<tr><td class="mono">' + escapeHtml(r.serial) + '</td><td class="mono">' + escapeHtml(r.ccms || '—') + '</td>' +
            '<td>' + escapeHtml(r.vertical || '—') + '</td><td>' + escapeHtml(r.checkedOutAt) + '</td>' +
            '<td>' + state + '</td><td' + (r.overdue ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + hoursLabel_(r.hoursOut) + '</td>' +
            '<td style="text-align:right">' +
              (r.isOpen && APP.session.role === 'Admin' ? '<button class="btn btn-sm lk-close" data-id="' + escapeHtml(r.id) + '">Close trip</button> ' : '') +
              '<button class="btn btn-sm lk-view" data-serial="' + escapeHtml(r.serial) + '">History</button></td></tr>';
        }).join('') + '</tbody></table>';
      holder.querySelectorAll('.lk-view').forEach(function (b) {
        b.addEventListener('click', function () { openKeyDetail_(b.dataset.serial); });
      });
      holder.querySelectorAll('.lk-close').forEach(function (b) {
        b.addEventListener('click', function () {
          call('api_forceCheckIn', b.dataset.id, '').then(function () { toast('Trip closed.', 'success'); loadList(); });
        });
      });
    })();
  }
  /** Applies a scan result to the list on screen without another server call. */
  function applyScan(res) {
    var m = res.movement;
    rows = rows.filter(function (r) { return r.id !== m.id; });
    if (res.action === 'out' || mode !== 'out') rows.unshift(m);
    draw();
  }
  function setMode(m) {
    mode = m;
    ['out', 'today', 'all'].forEach(function (k) {
      document.getElementById('lk-tab-' + k).classList.toggle('btn-primary', k === m);
    });
    loadList();
  }
  ['out', 'today', 'all'].forEach(function (k) {
    document.getElementById('lk-tab-' + k).addEventListener('click', function () { setMode(k); });
  });
  setMode('out');

  var input = document.getElementById('locker-input');
  if (!input) return;
  input.focus();
  document.getElementById('content').addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') input.focus();
  });
  function handleScan(prefix) {
    // Show a placeholder immediately so the next person can scan while this one is saving.
    var feed = document.getElementById('locker-result');
    var card = document.createElement('div');
    card.style.cssText = 'text-align:center;padding:10px;border-radius:12px;background:var(--neutral-bg);color:var(--neutral-text)';
    card.innerHTML = '<span class="spinner"></span>';
    feed.insertBefore(card, feed.firstChild);
    while (feed.children.length > 5) feed.removeChild(feed.lastChild);

    call('api_lockerScan', prefix).then(function (res) {
      var out = res.action === 'out';
      var tone = out ? 'warning' : 'success';
      card.style.background = 'var(--' + tone + '-bg)';
      card.style.color = 'var(--' + tone + '-text)';
      card.innerHTML = '<div style="font-size:17px;font-weight:800">' + (out ? 'Checked out' : 'Returned') + '</div>' +
        '<div class="mono" style="margin-top:2px">' + escapeHtml(res.key.serial) + (res.key.ccms ? ' · ' + escapeHtml(res.key.ccms) : '') +
        (out ? '' : ' · out ' + hoursLabel_(res.movement.hoursOut)) + '</div>';
      applyScan(res);
    }).catch(function () { if (card.parentNode) feed.removeChild(card); });
    input.focus();
  }
  attachOtpScan(input, handleScan);

  // Phone NFC: reads the key's NDEF link (my.yubico.com/yk/#<otp>) and
  // runs it through the same check-out / check-in path as a reader tap.
  var nfcBtn = document.getElementById('locker-nfc-btn');
  var nfcNote = document.getElementById('locker-nfc-note');
  if (nfcBtn) {
    if (!('NDEFReader' in window)) {
      nfcBtn.disabled = true;
      nfcNote.textContent = 'Phone NFC needs Chrome on Android. iPhone browsers cannot read NFC tags from a web page.';
    } else {
      var nfcReader = null, nfcOn = false;
      nfcBtn.addEventListener('click', function () {
        if (nfcOn) { nfcOn = false; nfcReader = null; nfcBtn.innerHTML = '<i class="ti ti-nfc"></i> Scan with phone NFC'; nfcNote.textContent = ''; return; }
        nfcReader = new NDEFReader();
        nfcReader.scan().then(function () {
          nfcOn = true;
          nfcBtn.innerHTML = '<i class="ti ti-player-stop"></i> Stop NFC scan';
          nfcNote.textContent = 'Ready. Hold the key against the back of the phone.';
          nfcReader.onreading = function (ev) {
            if (!nfcOn) return;
            var prefix = otpFromNdef_(ev.message);
            if (prefix) { if (navigator.vibrate) navigator.vibrate(60); handleScan(prefix); }
            else toast('That tag has no YubiKey OTP link.', 'error');
          };
          nfcReader.onreadingerror = function () { toast('Could not read the tag, try again.', 'error'); };
        }).catch(function (err) {
          nfcOn = false;
          nfcNote.textContent = 'NFC is blocked or turned off: ' + (err && err.message ? err.message : err);
        });
      });
    }
  }
}

// Pulls the 12-character public ID out of a tag's NDEF records.
function otpFromNdef_(message) {
  var dec = new TextDecoder();
  for (var i = 0; i < message.records.length; i++) {
    var rec = message.records[i];
    if (!rec.data) continue;
    var text = dec.decode(rec.data);
    var tail = text.indexOf('#') >= 0 ? text.slice(text.lastIndexOf('#') + 1) : text;
    tail = tail.trim();
    if (looksLikeOtpPrefix(tail)) return tail.slice(0, 12).toLowerCase();
  }
  return null;
}

function renderAuditFillPage(params) {
  var content = document.getElementById('content');
  var campaignId = params.campaign || params.campaignId;
  if (!campaignId) { content.innerHTML = emptyState('ti-clipboard-x', 'No audit campaign specified.'); return; }
  content.innerHTML = '<div id="audit-fill-holder" style="padding:40px;text-align:center"><span class="spinner"></span></div>';

  call('api_getMyAuditQueue', campaignId).then(function (q) {
    var holder = document.getElementById('audit-fill-holder');
    if (!q.campaign) { holder.innerHTML = emptyState('ti-clipboard-x', 'Campaign not found.'); return; }
    if (!q.items.length) { holder.innerHTML = emptyState('ti-circle-check', 'You have no keys to audit in this campaign.'); return; }

    var results = ['Has Key', 'No Key', 'Resigned', 'Unavailable', 'Wrong Serial', 'Damaged'];
    holder.innerHTML =
      '<div class="card card-pad mb-3"><h2>' + escapeHtml(q.campaign.name) + '</h2>' +
      '<p class="text-sm">Plug in each key and tap it below to confirm it instantly as "Has Key" — no clicking needed. ' +
      'If a key is missing, damaged, or wrong, use the manual options on that row instead.</p>' +
      '<input id="audit-scan-input" class="scan-input" placeholder="Tap a key here to confirm it…" autocomplete="off" />' +
      '<div class="scan-hint"><span class="scan-pulse"></span>Waiting for a tap — no need to press Enter</div>' +
      '</div>' +
      '<div id="audit-items-holder"></div>';

    renderAuditQueueItems_(q.items, campaignId, params);

    var scanInput = document.getElementById('audit-scan-input');
    scanInput.focus();
    attachOtpScan(scanInput, function (prefix) {
      call('api_resolveOtp', prefix).then(function (key) {
        var item = q.items.find(function (i) { return String(i.ccms) === String(key.ccms); });
        if (!item) {
          toast('That key (' + key.serial + ') isn\'t in your audit queue for this campaign.', 'error');
          scanInput.focus();
          return;
        }
        if (item.result) {
          toast(key.serial + ' was already confirmed as "' + item.result + '".', 'warning');
          scanInput.focus();
          return;
        }
        call('api_submitAuditResult', campaignId, key.ccms, 'Has Key', 'Confirmed via OTP scan').then(function () {
          toast(key.serial + ' confirmed — Has Key.', 'success');
          renderAuditFillPage(params);
        });
      }).catch(function () { scanInput.focus(); });
    });
  });
}

function renderAuditQueueItems_(items, campaignId, params) {
    var results = ['Has Key', 'No Key', 'Resigned', 'Unavailable', 'Wrong Serial', 'Damaged'];
    var holder = document.getElementById('audit-items-holder');
    holder.innerHTML = items.map(function (item) {
        return '<div class="card card-pad mb-3" data-ccms="' + escapeHtml(item.ccms) + '">' +
          '<div class="flex justify-between items-center">' +
            '<div><strong class="mono">' + escapeHtml(item.ccms) + '</strong><div class="text-muted text-sm">Serial on file: <span class="mono">' + escapeHtml(item.serialOnFile || 'none') + '</span></div></div>' +
            (item.result ? auditResultBadge_(item.result) : '') +
          '</div>' +
          (item.result ? '' :
            '<div class="pill-select mt-3 audit-result-pills">' +
              results.map(function (r) { return '<div class="pill" data-val="' + r + '">' + r + '</div>'; }).join('') +
            '</div>' +
            '<textarea class="mt-2 audit-comment" rows="1" placeholder="Comment (optional)"></textarea>' +
            '<button class="btn btn-sm btn-primary mt-2 audit-submit-btn">Submit</button>') +
          '</div>';
      }).join('');

    holder.querySelectorAll('.card[data-ccms]').forEach(function (card) {
      var pills = card.querySelectorAll('.audit-result-pills .pill');
      var selected = null;
      pills.forEach(function (p) {
        p.addEventListener('click', function () {
          pills.forEach(function (x) { x.classList.remove('active'); });
          p.classList.add('active'); selected = p.dataset.val;
        });
      });
      var submitBtn = card.querySelector('.audit-submit-btn');
      if (submitBtn) submitBtn.addEventListener('click', function () {
        if (!selected) { toast('Select a result first.', 'error'); return; }
        var comment = card.querySelector('.audit-comment').value.trim();
        call('api_submitAuditResult', campaignId, card.dataset.ccms, selected, comment).then(function () {
          toast('Result submitted.', 'success');
          renderAuditFillPage(params);
        });
      });
    });
}

    holder.querySelectorAll('.user-del-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        confirmDialog('Remove user', 'Remove access for ' + btn.dataset.email + '?', 'Remove', function () {
          call('api_removeUser', btn.dataset.email).then(function () { toast('User removed.', 'success'); loadUsers_(); });
        }, true);
      });
    });
  });
}

function openUserForm_(existing) {
  var isEdit = !!existing;
  openModal(
    '<div class="modal-header"><h3>' + (isEdit ? 'Edit user' : 'Add user') + '</h3></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>Email</label><input id="f-user-email" value="' + (existing ? escapeHtml(existing.email) : '') + '" ' + (isEdit ? 'disabled' : '') + ' /></div>' +
      '<div class="field"><label>Name</label><input id="f-user-name" value="' + (existing ? escapeHtml(existing.name) : '') + '" /></div>' +
      '<div class="field"><label>Role</label><select id="f-user-role">' +
        ['Admin', 'LOB Manager', 'Read Only'].map(function (r) { return '<option value="' + r + '"' + (existing && existing.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label>Vertical (for LOB Manager only)</label><input id="f-user-vertical" value="' + (existing ? escapeHtml(existing.vertical || '') : '') + '" /></div>' +
      '<div class="field"><label>CCMS (optional — used to resolve audit manager emails)</label><input id="f-user-ccms" value="' + (existing ? escapeHtml(existing.ccms || '') : '') + '" /></div>' +
      '<div class="field"><label>Active</label><select id="f-user-active">' +
        '<option value="true"' + (!existing || existing.active ? ' selected' : '') + '>Yes</option>' +
        '<option value="false"' + (existing && !existing.active ? ' selected' : '') + '>No</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="f-user-save">Save</button></div>'
  );
  document.getElementById('f-user-save').addEventListener('click', function () {
    var payload = {
      email: document.getElementById('f-user-email').value.trim(),
      name: document.getElementById('f-user-name').value.trim(),
      role: document.getElementById('f-user-role').value,
      vertical: document.getElementById('f-user-vertical').value.trim(),
      ccms: document.getElementById('f-user-ccms').value.trim(),
      active: document.getElementById('f-user-active').value === 'true'
    };
    call('api_upsertUser', payload).then(function () { toast('User saved.', 'success'); closeModal(); loadUsers_(); });
  });
}

/* JsActivity — full activity/audit-trail log */

function renderActivity() {
  var content = document.getElementById('content');
  content.innerHTML =
    '<div class="table-wrap">' +
      '<div class="table-toolbar"><input id="activity-search" style="width:220px" placeholder="Filter by record ID (serial)…" /></div>' +
      '<div id="activity-holder" style="padding:40px;text-align:center"><span class="spinner"></span></div>' +
    '</div>';
  document.getElementById('activity-search').addEventListener('input', debounce(loadActivity_, 300));
  loadActivity_();
}

function loadActivity_() {
  var recordId = document.getElementById('activity-search').value.trim();
  call('api_getActivityLog', recordId ? { recordId: recordId } : {}).then(function (rows) {
    var holder = document.getElementById('activity-holder');
    if (!rows.length) { holder.innerHTML = emptyState('ti-history', 'No activity recorded yet.'); return; }
    holder.innerHTML = '<table class="data"><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Record</th><th>Previous</th><th>New</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="text-sm">' + escapeHtml(r.timestamp) + '</td><td>' + escapeHtml(r.user) + '</td>' +
          '<td>' + escapeHtml(r.action) + '</td><td class="mono text-sm">' + escapeHtml(r.recordType) + ' · ' + escapeHtml(r.recordId) + '</td>' +
          '<td class="text-sm text-muted">' + escapeHtml(r.previousValue) + '</td><td class="text-sm">' + escapeHtml(r.newValue) + '</td></tr>';
      }).join('') + '</tbody></table>';
  });
}


/* JsBoot — runs once on page load: resolve session, gate access, boot the router. */

function boot() {
  initTheme();
  call('api_getSession').then(function (session) {
    APP.session = session;

    if (!session.role) {
      document.getElementById('loading-overlay').innerHTML =
        '<div class="card card-pad" style="max-width:420px;text-align:center">' +
        '<i class="ti ti-lock" style="font-size:32px;color:var(--warning)"></i>' +
        '<h2 class="mt-3">Access not provisioned</h2>' +
        '<p class="text-sm">Your account (' + escapeHtml(session.email || 'unknown') + ') is signed in but has no role yet. ' +
        'Ask an Admin to add this email under Users &amp; Roles.</p>' +
        '<button class="btn mt-3" onclick="signOut()">Sign out</button>' +
        '</div>';
      return;
    }

    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app-shell').style.display = 'flex';

    document.getElementById('company-name-label').textContent = session.companyName || 'Company';
    document.getElementById('user-name').textContent = session.name;
    document.getElementById('user-role').textContent = session.role + (session.vertical ? ' · ' + session.vertical : '');
    document.getElementById('user-avatar').textContent = (session.name || '?').split(' ').map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();

    if (session.role === 'Admin') {
      document.getElementById('admin-nav-section').style.display = '';
      document.getElementById('admin-nav-settings').style.display = '';
      document.getElementById('admin-nav-users').style.display = '';
    }

    call('api_getPendingRecovery').then(function (rows) {
      var badge = document.getElementById('nav-pending-badge');
      if (rows.length) { badge.style.display = 'inline-flex'; badge.textContent = rows.length; }
    });

    var globalSearch = document.getElementById('global-search');
    globalSearch.addEventListener('input', debounce(function () {
      if (globalSearch.value.trim().length < 2) return;
      navigate('keys');
      setTimeout(function () {
        var searchInput = document.getElementById('key-search');
        if (searchInput) { searchInput.value = globalSearch.value; searchInput.dispatchEvent(new Event('input')); }
      }, 50);
    }, 400));
    // Tapping a physical YubiKey while focused in the global search bar
    // resolves it straight to that key's detail view instead of running
    // a text search on the (meaningless) typed OTP string.
    attachOtpScan(globalSearch, function (prefix) {
      call('api_resolveOtp', prefix).then(function (key) {
        navigate('keys');
        setTimeout(function () { openKeyDetail_(key.serial); }, 50);
      });
    });

    var urlParams = new URLSearchParams(window.location.search);
    var initialView = urlParams.get('view') || 'dashboard';
    var initialParams = {};
    urlParams.forEach(function (v, k) { initialParams[k] = v; });

    navigate(initialView, initialParams);
  });
}


/* JsReports — exports are built in the browser from the same data the app shows. */

var REPORT_STATUS = {
  AssignedKeys: 'Assigned', AvailableKeys: 'Available', MissingKeys: 'Missing',
  DamagedKeys: 'Damaged', InStockKeys: 'In Stock'
};

function loadScript_(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

function downloadBlob_(blob, fileName) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}

function reportRows_(reportType, filters) {
  if (reportType === 'AuditReport') {
    return call('api_getAuditCampaignDetail', filters.campaignId).then(function (d) {
      var header = ['CCMS', 'Vertical', 'Manager', 'Serial On File', 'Result', 'Comment', 'Submitted At'];
      return [header].concat(d.items.map(function (i) {
        return [i.ccms, i.vertical, i.manager, i.serialOnFile, i.result, i.comment, i.submittedAt];
      }));
    });
  }
  var f = REPORT_STATUS[reportType] ? { status: REPORT_STATUS[reportType] } : {};
  return call('api_listKeys', f).then(function (keys) {
    var header = ['Serial Number', 'Status', 'CCMS', 'Uber Email', 'Manager CCMS', 'Vertical'];
    return [header].concat(keys.map(function (k) { return [k.serial, k.status, k.ccms, k.uberEmail, k.managerCcms, k.vertical]; }));
  });
}

function exportReport(reportType, format, filters) {
  return reportRows_(reportType, filters).then(function (rows) {
    var stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
    var name = reportType + '_' + stamp;

    if (format === 'csv') {
      var csv = rows.map(function (row) {
        return row.map(function (cell) {
          var s = String(cell === null || cell === undefined ? '' : cell);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',');
      }).join('\n');
      downloadBlob_(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), name + '.csv');
    } else if (format === 'xlsx') {
      return (window.XLSX ? Promise.resolve() : loadScript_('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')).then(function () {
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Report');
        XLSX.writeFile(wb, name + '.xlsx');
        return { rowCount: rows.length - 1 };
      });
    } else {
      // PDF: open a print view; the browser's "Save as PDF" does the rest.
      var w = window.open('', '_blank');
      if (!w) throw new Error('Allow pop-ups to export a PDF.');
      w.document.write('<html><head><title>' + escapeHtml(name) + '</title><style>' +
        'body{font-family:Arial,sans-serif;font-size:12px;padding:20px}table{border-collapse:collapse;width:100%}' +
        'th,td{border:1px solid #ccc;padding:5px 8px;text-align:left}th{background:#0B0A12;color:#fff}</style></head><body>' +
        '<h3>' + escapeHtml(reportType) + '</h3><table>' + rows.map(function (r, i) {
          var tag = i === 0 ? 'th' : 'td';
          return '<tr>' + r.map(function (c) { return '<' + tag + '>' + escapeHtml(String(c == null ? '' : c)) + '</' + tag + '>'; }).join('') + '</tr>';
        }).join('') + '</table></body></html>');
      w.document.close(); w.focus(); w.print();
    }
    return { rowCount: rows.length - 1 };
  });
}

/* JsAuth — sign-in screen and session handling. */

function showLogin_(message) {
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('login-error').textContent = message || '';
}

function signOut() {
  sb.auth.signOut().then(function () { window.location.reload(); });
}

function initAuth() {
  var form = document.getElementById('login-form');
  var submitBtn = document.getElementById('login-submit');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var errEl = document.getElementById('login-error');
    errEl.textContent = '';
    submitBtn.disabled = true;
    sb.auth.signInWithPassword({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-password').value
    }).then(function (res) {
      submitBtn.disabled = false;
      if (res.error) { errEl.textContent = 'Incorrect email or password.'; return; }
      window.location.reload();
    });
  });

  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) boot(); else showLogin_();
  });
  document.getElementById('logout-btn').addEventListener('click', signOut);
}

initAuth();

  </script>
